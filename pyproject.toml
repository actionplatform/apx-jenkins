[project]
name = "apx-jenkins"
version = "0.1.0"
description = "Jenkins for Action Platform: the CI runner deploys and Run CI go through, access management through Role-based Authorization Strategy, and read-only tools for jobs."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Action Platform", email = "cloud@actionplatform.io" }]
dependencies = ["action-platform>=0.38"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "action-platform[mcp]"]

[project.entry-points."action_platform.plugins"]
jenkins = "apx_jenkins:JenkinsPlugin"

[project.entry-points."action_platform.ci_runner"]
jenkins = "apx_jenkins.runner:JenkinsRunner"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apx_jenkins*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
